security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'plaintext' # Use plain text passwords for now
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: Email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login_check
                default_target_path: app_blog_index
            logout:
                path: app_logout
                target: app_login
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/message, roles: ROLE_USER } # Allow only logged-in users to access messages
        - { path: ^/blog/\d+/message, roles: ROLE_USER } # Ensure message route security
        - { path: ^/, roles: ROLE_USER } # General restriction for other routes
